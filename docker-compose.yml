# File: docker-compose.yml
# Production-like compose. Builds optimised images with no hot reload.
# Usage: docker compose up --build

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        # Empty string forces relative-path API calls so nginx proxies /api/ to backend.
        # Do NOT set this to http://localhost:8000 — the backend port is not exposed in prod.
        VITE_API_URL: ""
    ports:
      - "80:8080"
    depends_on:
      - backend
    restart: unless-stopped
