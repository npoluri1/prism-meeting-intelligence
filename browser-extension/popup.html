<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Prism Live Capture</title>
  <style>
    body { font-family: sans-serif; padding: 16px; width: 250px; }
    button { background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; width: 100%; margin: 4px 0; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { font-size: 12px; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <h3>Prism Live Capture</h3>
  <button id="startBtn">Start Capture</button>
  <button id="stopBtn" disabled>Stop Capture</button>
  <div class="status" id="status">Ready (Phase 5 stub)</div>
  <p style="font-size:11px;color:#999;">Audio is sent to Prism for live transcription.</p>
  <script src="popup.js"></script>
</body>
</html>
